spring.application.name=snippet-service
server.port=8080

# solo se expone health: el resto de actuator muestra datos internos que nadie afuera necesita
management.endpoints.web.exposure.include=health

# todo lo que cambia entre maquinas entra por variables de entorno (12-factor III).
# Los defaults son para correrlo local contra el compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/snippets}
spring.datasource.username=${DB_USER:snippet}
spring.datasource.password=${DB_PASSWORD:snippet}

# el esquema es de Flyway: Hibernate solo verifica que las entidades coincidan con las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

services.printscript.url=${PRINTSCRIPT_SERVICE_URL:http://localhost:8082}
services.permission.url=${PERMISSION_SERVICE_URL:http://localhost:8081}
services.asset.url=${ASSET_SERVICE_URL:http://localhost:8083}

# un snippet es texto: 1MB sobra, y corta subidas de archivos que no tienen nada que ver
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
